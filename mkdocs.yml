site_name: OpenCreator
site_description: Creator 5 full-custom-firmware project documentation
repo_url: https://github.com/FlashForge-C5-Modding-Group/OpenCreator
repo_name: FlashForge-C5-Modding-Group/OpenCreator
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - content.action.edit
    - content.code.copy
    - search.suggest
    - search.highlight
    - content.tooltips
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - abbr
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
    - Getting started: getting-started.md
    - Installation: installation-and-safety.md
    - Slicer Configuration: slicer-config.md
  - OpenCreator Editions:
    - OpenCreator Legacy: opencreator-legacy.md
    - OpenCreator CFW: opencreator-cfw.md
    - OpenCreator CFW Features: cfwfeatures.md
    - OpenCreator for SBC: rpi-klipper.md
    - What makes us different: different.md
  - Technical Reference:
    - Architecture: architecture.md
    - MCU development and verification: mcu-development.md
    - Print workflow: print-workflow.md
    - Printer Features: printer-features.md
    - Project layout: project-layout.md
  - Project:
    - Status and roadmap: status-and-roadmap.md
    - Contributing: contributing.md
    - Attributions: attributions.md
