name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r docs/requirements.txt

      - run: python -m zensical build --strict --clean

      - name: Deploy to opencreatorcfw.github.io
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: OpenCreatorCFW/opencreatorcfw.github.io
          publish_branch: main
          publish_dir: ./site
          force_orphan: true
